# AI 短视频工作室 (Java) — runtime config
server.port=8791
server.address=127.0.0.1

# data dirs (owned by this install; on foreign machines the app falls back
# to %USERPROFILE%\YUCL\media automatically — see DataDirs.usableDir)
aivideo.voices.dir=D:/YUCL/media/voices
aivideo.images.dir=D:/YUCL/media/images
aivideo.music.dir=D:/YUCL/media/music

# app log (rolling file, exposed via GET /api/plugins/ai-video/logs).
# Actual path is always resolved from the data dir at runtime (see Api's
# constructor); the property below is only a legacy default.
aivideo.log.file=D:/YUCL/data/app.log

# multipart upload cap (endpoint enforces 50MB itself; keep the gateway limit above that)
spring.servlet.multipart.max-file-size=55MB
spring.servlet.multipart.max-request-size=55MB

spring.main.banner-mode=off
logging.level.root=INFO
